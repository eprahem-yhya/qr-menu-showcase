<style>
  :root{
    --bg:#faf7f2; --surface:#fff; --ink:#14110e; --muted:#6b6259;
    --accent:#a8441a; --accent-soft:#f4e7de; --line:#e8ddd2;
    --ok:#2f7d52;
    --radius:18px;
    --shell:1180px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Cairo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.7;
  }
  .wrap{max-width:var(--shell); margin:0 auto; padding:0 1.25rem}
  a{color:inherit}

  /* ---------------------------------------------------------- top bar */
  header.bar{
    position:sticky; top:0; z-index:20;
    background:rgba(250,247,242,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar .wrap{display:flex; align-items:center; gap:1rem; height:64px}
  .brand{display:flex; align-items:center; gap:.6rem; font-weight:800}
  .brand .mark{
    width:34px; height:34px; border-radius:10px; background:var(--accent);
    color:#fff; display:grid; place-items:center; font-size:1rem;
  }
  .bar .spacer{flex:1}
  .langs{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
  .langs button{
    border:0; background:var(--surface); color:var(--muted);
    padding:.35rem .85rem; font:inherit; font-size:.85rem; cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--accent); color:#fff}

  /* ------------------------------------------------------------- hero */
  .hero{padding:clamp(2.5rem,6vw,4.5rem) 0 1.5rem}
  .hero h1{
    font-size:clamp(1.9rem,4.6vw,3.1rem); line-height:1.25; margin:0 0 .75rem;
    letter-spacing:-.02em;
  }
  .hero p.lede{font-size:clamp(1rem,2.1vw,1.2rem); color:var(--muted); max-width:56ch; margin:0 0 1.5rem}
  .cta{display:flex; flex-wrap:wrap; gap:.7rem; align-items:center}
  .btn{
    display:inline-flex; align-items:center; gap:.5rem; text-decoration:none;
    padding:.8rem 1.3rem; border-radius:999px; font-weight:600; font-size:.98rem;
    border:1px solid transparent;
  }
  .btn-main{background:var(--accent); color:#fff}
  .btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
  .tagline{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1.4rem}
  .pill{
    background:var(--accent-soft); color:var(--accent); border-radius:999px;
    padding:.3rem .8rem; font-size:.83rem; font-weight:600;
  }

  /* ------------------------------------------------------ the viewer */
  section{padding:clamp(2rem,5vw,3.5rem) 0}
  h2{font-size:clamp(1.35rem,3vw,1.9rem); margin:0 0 .4rem}
  .sub{color:var(--muted); margin:0 0 1.75rem; max-width:62ch}

  /* Mobile: one view at a time, switched from the top. Desktop: both. */
  .switch{display:flex; gap:.5rem; margin-bottom:1.25rem}
  .switch button{
    flex:1; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:12px; padding:.75rem .5rem;
    font:inherit; font-weight:600; cursor:pointer; font-size:.92rem;
  }
  .switch button[aria-pressed="true"]{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }

  .views{display:grid; gap:clamp(1.25rem,3vw,2rem)}
  .view h3{margin:0 0 .25rem; font-size:1.05rem}
  .view p{margin:0 0 1rem; color:var(--muted); font-size:.92rem}

  .phone{
    background:#1b1512; border-radius:32px; padding:10px;
    box-shadow:0 20px 45px -22px rgba(20,17,14,.55);
    max-width:330px; margin-inline:auto;
  }
  .phone img{
    display:block; width:100%; height:auto; border-radius:24px;
    background:var(--bg);
  }
  .shots{display:grid; grid-template-columns:1fr; gap:1rem}

  @media (min-width:900px){
    .switch{display:none}
    .views{grid-template-columns:1fr 1fr; align-items:start}
    #view-cashier{grid-column:1 / -1}
    #view-cashier .shots{max-width:340px; margin-inline:auto}
    .view{display:block !important}
  }

  /* --------------------------------------------------------- features */
  .grid{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:1.25rem;
  }
  .card h3{margin:.1rem 0 .4rem; font-size:1.02rem}
  .card p{margin:0; color:var(--muted); font-size:.92rem}
  .card .ic{
    width:36px; height:36px; border-radius:10px; background:var(--accent-soft);
    color:var(--accent); display:grid; place-items:center; margin-bottom:.7rem;
  }
  .icon{width:20px; height:20px; stroke-width:1.9; fill:none; stroke:currentColor;
        stroke-linecap:round; stroke-linejoin:round}

  /* ------------------------------------------------------- highlight */
  .why{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:clamp(1.25rem,3vw,2rem);
  }
  .why ul{margin:0; padding-inline-start:1.1rem}
  .why li{margin-bottom:.6rem}
  .why li strong{font-weight:700}

  /* ------------------------------------------------------- printing */
  .paper{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:.75rem; max-width:260px;
  }
  .paper img{display:block; width:100%; height:auto; image-rendering:pixelated}

  /* --------------------------------------------------------- contact */
  .buy{
    background:var(--accent); color:#fff; border-radius:var(--radius);
    padding:clamp(1.5rem,4vw,2.5rem); text-align:center;
  }
  .buy h2{margin:0 0 .5rem}
  .buy p{margin:0 0 1.4rem; opacity:.92}
  .buy .btn-main{background:#fff; color:var(--accent)}

  footer{padding:2.5rem 0 3.5rem; color:var(--muted); font-size:.88rem; text-align:center}

  /* Keyboard focus, which had no visible state at all: every control here
     is a button or a link, and without this a visitor tabbing through the
     page cannot see where they are. */
  :where(a,button):focus-visible{
    outline:3px solid var(--accent); outline-offset:3px; border-radius:8px;
  }
  .buy .btn-main:focus-visible{outline-color:#fff}

  @media (prefers-reduced-motion:reduce){
    *{scroll-behavior:auto !important}
  }

  [hidden]{display:none !important}
  :lang(en){letter-spacing:0}
</style>
</head>

<script>
(function () {
  var nodes = document.querySelectorAll('[data-ar]:not(img)');
  var arBtn = document.getElementById('lang-ar');
  var enBtn = document.getElementById('lang-en');
  function apply(lang) {
    var rtl = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    nodes.forEach(function (n) { n.innerHTML = n.getAttribute(rtl ? 'data-ar' : 'data-en') || ''; });
    arBtn.setAttribute('aria-pressed', String(rtl));
    enBtn.setAttribute('aria-pressed', String(!rtl));
    try { localStorage.setItem('qrm.site.lang', lang); } catch (e) { /* private mode */ }
  }
  arBtn.onclick = function () { apply('ar'); };
  enBtn.onclick = function () { apply('en'); };
  var saved = null;
  try { saved = localStorage.getItem('qrm.site.lang'); } catch (e) { /* ignore */ }
  var prefersArabic = (navigator.language || '').toLowerCase().indexOf('ar') === 0;
  apply(saved || (prefersArabic ? 'ar' : 'en'));
})();
